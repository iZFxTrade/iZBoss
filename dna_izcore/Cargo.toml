[package]
name = "dna_izcore"
version = "0.1.0"
description = "iZ.Life BOSS - The DNA Kernel"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sysinfo = "0.30"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mac_address = "1.1"
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "mdns", "gossipsub", "macros", "tokio"] }
