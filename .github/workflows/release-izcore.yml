name: 🚀 iZCore Release Builder

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: dna_izcore

jobs:
  # ──────────────────────────────────────────────────────────
  # Build Matrix: Linux + Windows + Embedded (via cross)
  # ──────────────────────────────────────────────────────────
  build-cross:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (statically linked via musl)
          - target: x86_64-unknown-linux-musl
            os_name: linux
            arch_name: x86_64
            artifact: iZCore-linux-x86_64

          # Linux ARM64 (Raspberry Pi 4+, cloud ARM)
          - target: aarch64-unknown-linux-musl
            os_name: linux
            arch_name: aarch64
            artifact: iZCore-linux-aarch64

          # Linux ARMv7 (Raspberry Pi 2/3, FPT Play Box)
          - target: armv7-unknown-linux-musleabihf
            os_name: embedded
            arch_name: armv7hf
            artifact: iZCore-embedded-armv7hf

          # Windows x86_64
          - target: x86_64-pc-windows-gnu
            os_name: windows
            arch_name: x86_64
            artifact: iZCore-windows-x86_64.exe

          # Android ARM64 (Samsung Note 10+, modern phones)
          - target: aarch64-linux-android
            os_name: android
            arch_name: aarch64
            artifact: iZCore-android-aarch64

          # Android ARMv7 (Samsung Note 9, older phones)
          - target: armv7-linux-androideabi
            os_name: android
            arch_name: armv7
            artifact: iZCore-android-armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build ${{ matrix.artifact }}
        run: |
          cross build -p dna_izcore \
            --release \
            --target ${{ matrix.target }}
        env:
          FOUNDER_SECRET_KEY: ${{ secrets.FOUNDER_SECRET_KEY }}
          FOUNDER_ID_1: ${{ secrets.FOUNDER_ID_1 || 'iz-master-root' }}
          FOUNDER_ID_2: ${{ secrets.FOUNDER_ID_2 || 'iz-backup-root' }}
          FOUNDER_WALLET_ADDRESS: ${{ secrets.FOUNDER_WALLET_ADDRESS }}

      - name: Rename binary (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          cp target/${{ matrix.target }}/release/dna_izcore \
             ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: |
          cp target/${{ matrix.target }}/release/dna_izcore.exe \
             ${{ matrix.artifact }}

      - name: Generate SHA256 checksum
        run: |
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256 2>/dev/null || \
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  # ──────────────────────────────────────────────────────────
  # macOS Native Builds (x86_64 + Apple Silicon)
  # ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: iZCore-macos-aarch64

          - arch: x86_64
            os: macos-13
            target: x86_64-apple-darwin
            artifact: iZCore-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ${{ matrix.artifact }}
        run: |
          cargo build -p dna_izcore \
            --release \
            --target ${{ matrix.target }}
        env:
          FOUNDER_SECRET_KEY: ${{ secrets.FOUNDER_SECRET_KEY }}
          FOUNDER_ID_1: ${{ secrets.FOUNDER_ID_1 || 'iz-master-root' }}
          FOUNDER_ID_2: ${{ secrets.FOUNDER_ID_2 || 'iz-backup-root' }}
          FOUNDER_WALLET_ADDRESS: ${{ secrets.FOUNDER_WALLET_ADDRESS }}

      - name: Prepare binary
        run: |
          cp target/${{ matrix.target }}/release/dna_izcore ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  # ──────────────────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────────────────
  release:
    name: 📦 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cross, build-macos]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah release-artifacts/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "iZCore ${{ steps.version.outputs.tag }} — The DNA Kernel"
          draft: false
          prerelease: false
          body: |
            # 🧬 iZCore ${{ steps.version.outputs.tag }} — The DNA Kernel

            **iZBoss Autonomous Entity** — Cài đặt trên mọi thiết bị với một lệnh duy nhất.

            ## ⚡ Quick Install (Every Device)
            You can install iZCore on any device (Linux, macOS, Android, Embedded) using one of these commands:

            **Option 1: Via System Domain (Recommended)**
            ```bash
            curl -fsSL https://boss.iz.life/install | sh
            ```

            **Option 2: Direct from GitHub (Fallback/Absolute Trust)**
            - Unix-like: `curl -fsSL https://raw.githubusercontent.com/iZFxTrade/iZBoss/main/dna_izcore/install.sh | sh`
            - Windows: `irm https://raw.githubusercontent.com/iZFxTrade/iZBoss/main/dna_izcore/install.ps1 | iex`

            ## 📦 Tải thủ công theo nền tảng

            | Nền tảng | File | Ghi chú |
            |---|---|---|
            | 🪟 Windows x86_64 | `iZCore-windows-x86_64.exe` | Chạy trực tiếp |
            | 🍎 macOS Apple Silicon | `iZCore-macos-aarch64` | Mac Mini M4, MacBook M1/M2/M3 |
            | 🍎 macOS Intel | `iZCore-macos-x86_64` | MacBook Intel |
            | 🐧 Linux x86_64 | `iZCore-linux-x86_64` | VPS/Server Ubuntu/Debian |
            | 🐧 Linux ARM64 | `iZCore-linux-aarch64` | Raspberry Pi 4+, Cloud ARM |
            | 🤖 Android ARM64 | `iZCore-android-aarch64` | Samsung Note 10+, modern phones |
            | 🤖 Android ARMv7 | `iZCore-android-armv7` | Samsung Note 9, older phones |
            | 📡 Embedded ARMv7hf | `iZCore-embedded-armv7hf` | FPT Play Box, Raspberry Pi 2/3 |

            ## 🔐 Xác minh SHA256
            ```bash
            ## 🚀 Chạy sau khi tải
            ```bash
            chmod +x izcore-*
            BOSS_MASTER_KEY=your_key ./izcore-linux-x86_64
            ```

            ## 📋 Changelog
            - ✅ Hardware fingerprinting (CPU + MAC + Disk → SHA256)
            - ✅ ED25519 auth gate (env key + keyfile)
            - ✅ Auto-register with boss.iz.life
            - ✅ Heartbeat loop (30s) — maintains node status
            - ✅ P2P peer discovery via Command Center
            - ✅ OTA listener (60s) — auto-update when new version available
          files: |
            release-artifacts/*
